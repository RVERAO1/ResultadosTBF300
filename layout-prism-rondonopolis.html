<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Circuito MT 2026 • Etapa 2 • Rondonópolis</title>

  <style>
    :root {
      --amarelo: #ffd43b;
      --amarelo-borda: rgba(255, 212, 59, 0.96);
      --verde: #21d18d;
      --texto: #f7f9fd;
      --muted: rgba(255,255,255,0.78);
      --muted2: rgba(255,255,255,0.58);
      --chrome: linear-gradient(135deg, rgba(6,16,32,0.97), rgba(17,34,62,0.96));
      --card-bg: linear-gradient(135deg, rgba(8,22,44,0.97), rgba(31,53,84,0.95));
      --row-bg: rgba(255,255,255,0.065);
      --shadow: 0 16px 34px rgba(0,0,0,0.38);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      font-family: Arial, Helvetica, sans-serif;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      color: var(--texto);
    }

    body { position: relative; }

    .viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
    }

    .overlay {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1920px;
      height: 1080px;
      transform: translate(-50%, -50%) scale(var(--scale, 1));
      transform-origin: center center;
      overflow: hidden;
      background: transparent;
    }

    /* Áreas opacas do layout. Somente as duas janelas de câmera permanecem transparentes. */
    .chrome-top,
    .chrome-left,
    .chrome-right,
    .chrome-center,
    .chrome-bottom {
      position: absolute;
      background: var(--chrome);
      z-index: 1;
      pointer-events: none;
    }

    .chrome-top {
      left: 0;
      right: 0;
      top: 0;
      height: 96px;
      border-bottom: 2px solid rgba(255,212,59,0.34);
    }

    .chrome-left {
      left: 0;
      top: 96px;
      bottom: 0;
      width: 28px;
    }

    .chrome-right {
      right: 0;
      top: 96px;
      bottom: 0;
      width: 28px;
    }

    .chrome-center {
      left: 950px;
      top: 96px;
      width: 20px;
      height: 632px;
      background: linear-gradient(180deg, rgba(8,22,42,0.98), rgba(11,32,52,0.97));
    }

    .chrome-bottom {
      left: 0;
      right: 0;
      top: 728px;
      bottom: 0;
      border-top: 2px solid rgba(255,212,59,0.32);
    }

    .top-title {
      position: absolute;
      left: 34px;
      top: 20px;
      z-index: 10;
    }

    .top-title .eyebrow {
      font-size: 15px;
      font-weight: 900;
      color: var(--amarelo);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .top-title .title {
      font-size: 29px;
      line-height: 1;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    .top-info {
      position: absolute;
      top: 14px;
      right: 34px;
      width: 425px;
      min-height: 68px;
      padding: 11px 16px;
      border: 1px solid var(--amarelo-borda);
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(13,29,53,.98), rgba(38,58,91,.96));
      box-shadow: var(--shadow);
      z-index: 20;
    }

    .top-info .title {
      font-size: 22px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-info .sub {
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .top-info .status {
      margin-top: 4px;
      font-size: 10px;
      font-weight: 800;
      color: var(--muted2);
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .camera-wrap {
      position: absolute;
      left: 28px;
      right: 28px;
      top: 96px;
      height: 632px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      z-index: 5;
    }

    .camera-box {
      position: relative;
      width: 100%;
      height: 632px;
      border: 3px solid var(--amarelo-borda);
      border-radius: 0;
      background: transparent;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.22);
    }

    .camera-label {
      position: absolute;
      top: 14px;
      left: 14px;
      display: inline-flex;
      align-items: center;
      padding: 9px 17px;
      border-radius: 999px;
      background: linear-gradient(135deg, #29d99a, #14b47a);
      color: #07131f;
      font-size: 17px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 10px 24px rgba(0,0,0,.25);
    }

    .camera-live {
      position: absolute;
      top: 14px;
      right: 14px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 17px;
      border-radius: 999px;
      background: rgba(8,17,30,0.88);
      border: 1px solid rgba(241,194,50,0.60);
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 10px 24px rgba(0,0,0,.25);
    }

    .camera-live::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #21e38a;
      box-shadow: 0 0 10px rgba(33,227,138,.75);
    }

    .boards {
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 16px;
      height: 320px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      z-index: 10;
    }

    .board-card {
      position: relative;
      height: 320px;
      border: 2px solid var(--amarelo-borda);
      border-radius: 18px;
      background: var(--card-bg);
      box-shadow: var(--shadow);
      padding: 14px 14px 12px;
      overflow: hidden;
    }

    .board-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 10px;
    }

    .board-title {
      font-size: 20px;
      font-weight: 900;
      text-transform: uppercase;
      color: #ffd449;
      letter-spacing: .35px;
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .board-badge {
      flex: 0 0 auto;
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px solid rgba(241,194,50,.75);
      background: rgba(255,255,255,0.08);
      color: #fff7cd;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .6px;
    }

    .board-sub {
      font-size: 10px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 7px;
    }

    .table-head,
    .table-row {
      display: grid;
      grid-template-columns: 40px 1fr 70px 62px;
      align-items: center;
      gap: 8px;
    }

    .table-head {
      background: rgba(38,217,154,0.18);
      border-radius: 10px;
      padding: 7px 9px;
      margin-bottom: 6px;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      color: #eef5ff;
      letter-spacing: .6px;
    }

    .rows {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-height: 208px;
    }

    .table-row {
      min-height: 36px;
      border-radius: 10px;
      padding: 5px 9px;
      background: var(--row-bg);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .pos {
      width: 27px;
      height: 27px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffe27a, #e4b71c);
      color: #102037;
      font-size: 14px;
      font-weight: 900;
    }

    .name {
      font-size: 13px;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .val,
    .avg {
      font-size: 14px;
      font-weight: 900;
      text-align: right;
      color: #fff;
    }

    .avg { color: var(--amarelo); }

    .empty-state {
      height: 205px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      color: rgba(255,255,255,.85);
      font-size: 17px;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.3;
    }

    .card-footer {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 9px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: .45px;
      border-top: 1px solid rgba(255,212,59,0.18);
      padding-top: 5px;
    }

    .card-footer .live-dot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .card-footer .live-dot::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #1fe28a;
      box-shadow: 0 0 7px rgba(31,226,138,.7);
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="overlay" id="overlay">
      <div class="chrome-top"></div>
      <div class="chrome-left"></div>
      <div class="chrome-right"></div>
      <div class="chrome-center"></div>
      <div class="chrome-bottom"></div>

      <div class="top-title">
        <div class="eyebrow">Circuito MT 2026</div>
        <div class="title">Etapa 2 • Rondonópolis</div>
      </div>

      <div class="top-info">
        <div class="title">Circuito MT 2026</div>
        <div class="sub">Etapa 2 • Rondonópolis</div>
        <div class="status" id="statusAtualizacao">Carregando dados…</div>
      </div>

      <div class="camera-wrap">
        <div class="camera-box">
          <div class="camera-label" id="cam1Label">Câmera 1</div>
          <div class="camera-live">Ao vivo</div>
        </div>
        <div class="camera-box">
          <div class="camera-label" id="cam2Label">Câmera 2</div>
        </div>
      </div>

      <div class="boards">
        <div class="board-card" id="card-m1"></div>
        <div class="board-card" id="card-m2"></div>
        <div class="board-card" id="card-f"></div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const CONFIG = {
      evento: params.get("evento") || "589",
      dia: params.get("dia") || "1",
      limite: Number(params.get("limite") || "5"),
      apiBase: (params.get("api") || "").replace(/\/$/, ""),
      cam1: params.get("cam1") || "Câmera 1",
      cam2: params.get("cam2") || "Câmera 2"
    };

    const categorias = [
      { key: "masculino-1", nome: "1ª Divisão Masculina", cardId: "card-m1" },
      { key: "masculino-2", nome: "2ª Divisão Masculina", cardId: "card-m2" },
      { key: "feminino", nome: "1ª Divisão Feminina", cardId: "card-f" }
    ];

    const fallbackCircuito = {
      "masculino-1": [
        { posicao: 1, atleta: "Michel Belmonte", pontos: 100, maiorLinha: 224 },
        { posicao: 2, atleta: "Thiago Wandscher", pontos: 85, maiorLinha: 214 },
        { posicao: 3, atleta: "Nilo Ponce", pontos: 75, maiorLinha: 217 },
        { posicao: 4, atleta: "Matheus Verão", pontos: 65, maiorLinha: 232 },
        { posicao: 5, atleta: "Romildo Souza", pontos: 60, maiorLinha: 168 }
      ],
      "masculino-2": [
        { posicao: 1, atleta: "Gustavo Buzelle", pontos: 100, maiorLinha: 170 },
        { posicao: 2, atleta: "Ronaldo Oliveira", pontos: 85, maiorLinha: 168 },
        { posicao: 3, atleta: "Nelson Saga", pontos: 75, maiorLinha: 177 },
        { posicao: 4, atleta: "Gilberto Ribeiro", pontos: 65, maiorLinha: 177 },
        { posicao: 5, atleta: "Célio Belmonte", pontos: 60, maiorLinha: 208 }
      ],
      "feminino": [
        { posicao: 1, atleta: "Raquel Tenuta", pontos: 100, maiorLinha: 183 },
        { posicao: 2, atleta: "Josélia Moreno", pontos: 85, maiorLinha: 168 },
        { posicao: 3, atleta: "Edneia Miranda Saga", pontos: 75, maiorLinha: 158 },
        { posicao: 4, atleta: "Dani Ledur", pontos: 65, maiorLinha: 144 },
        { posicao: 5, atleta: "Agda Nogueira", pontos: 60, maiorLinha: 142 }
      ]
    };

    document.getElementById("cam1Label").textContent = CONFIG.cam1;
    document.getElementById("cam2Label").textContent = CONFIG.cam2;

    function ajustarEscala() {
      const escala = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      document.documentElement.style.setProperty("--scale", escala);
    }

    ajustarEscala();
    window.addEventListener("resize", ajustarEscala);

    function formatMedia(valor) {
      const num = Number(valor || 0);
      return num.toFixed(2).replace(".", ",");
    }

    function renderCard(categoria, atletas, modo = "fallback") {
      const el = document.getElementById(categoria.cardId);
      const isFallback = modo === "fallback";
      const badge = isFallback ? "Circuito" : "Top 5";
      const col3 = isFallback ? "Pts" : "Total";
      const col4 = isFallback ? "ML" : "Média";

      const rows = Array.isArray(atletas) && atletas.length
        ? atletas.slice(0, CONFIG.limite).map(item => `
            <div class="table-row">
              <div><span class="pos">${item.posicao}</span></div>
              <div class="name">${item.atleta}</div>
              <div class="val">${isFallback ? item.pontos : item.total}</div>
              <div class="avg">${isFallback ? item.maiorLinha : formatMedia(item.media)}</div>
            </div>
          `).join("")
        : `<div class="empty-state">Aguardando dados da categoria</div>`;

      el.innerHTML = `
        <div class="board-head">
          <div class="board-title">${categoria.nome}</div>
          <div class="board-badge">${badge}</div>
        </div>
        <div class="board-sub">${isFallback ? "Classificação após a Etapa 1" : "Resultado automático da Etapa 2"}</div>
        <div class="table-head">
          <div>#</div><div>Atleta</div><div style="text-align:right">${col3}</div><div style="text-align:right">${col4}</div>
        </div>
        <div class="rows">${rows}</div>
        <div class="card-footer">
          <div class="live-dot">${isFallback ? "Circuito após Etapa 1" : "Atualização automática"}</div>
          <div>${isFallback ? "Fallback" : "Boliche Brasil"}</div>
        </div>
      `;
    }

    async function carregarCategoria(categoria) {
      if (!CONFIG.apiBase) {
        renderCard(categoria, fallbackCircuito[categoria.key], "fallback");
        return false;
      }

      try {
        const url = `${CONFIG.apiBase}/api/top?evento=${encodeURIComponent(CONFIG.evento)}&categoria=${encodeURIComponent(categoria.key)}&dia=${encodeURIComponent(CONFIG.dia)}&limite=${encodeURIComponent(CONFIG.limite)}&_=${Date.now()}`;
        const resp = await fetch(url, { cache: "no-store" });
        if (!resp.ok) throw new Error("Falha HTTP");
        const dados = await resp.json();
        const atletas = Array.isArray(dados.atletas) ? dados.atletas : [];

        if (dados.status === "ok" && atletas.length) {
          renderCard(categoria, atletas, "live");
          return true;
        }
      } catch (e) {}

      renderCard(categoria, fallbackCircuito[categoria.key], "fallback");
      return false;
    }

    async function carregarTudo() {
      const statusEl = document.getElementById("statusAtualizacao");
      statusEl.textContent = "Atualizando…";
      const resultados = await Promise.all(categorias.map(carregarCategoria));
      statusEl.textContent = resultados.some(Boolean)
        ? "Dados oficiais da Etapa 2"
        : "Exibindo classificação após a Etapa 1";
    }

    carregarTudo();
    setInterval(carregarTudo, 30000);
  </script>
</body>
</html>
