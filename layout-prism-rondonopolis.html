<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Circuito MT 2026 • Etapa 2 • Rondonópolis</title>

  <style>
    :root {
      --amarelo: #ffd43b;
      --amarelo-borda: rgba(255, 212, 59, 0.94);
      --verde: #21d18d;
      --texto: #f7f9fd;
      --muted: rgba(255,255,255,0.78);
      --muted2: rgba(255,255,255,0.58);
      --card-bg: linear-gradient(135deg, rgba(8,22,44,0.94), rgba(31,53,84,0.86));
      --row-bg: rgba(255,255,255,0.060);
      --shadow: 0 16px 34px rgba(0,0,0,0.34);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    html,
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      color: var(--texto);
    }

    body {
      position: relative;
    }

    .overlay {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }

    .top-info {
      position: absolute;
      top: 28px;
      right: 32px;
      width: 470px;
      min-height: 118px;
      padding: 18px 22px;
      border: 2px solid var(--amarelo-borda);
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(9,18,35,.93), rgba(33,56,93,.84));
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 30;
    }

    .top-info .eyebrow {
      font-size: 18px;
      line-height: 1;
      font-weight: 1000;
      color: var(--amarelo);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .top-info .title {
      font-size: 28px;
      line-height: 1.05;
      font-weight: 1000;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .top-info .sub {
      font-size: 15px;
      font-weight: 900;
      color: var(--muted);
      letter-spacing: .4px;
      text-transform: uppercase;
      line-height: 1.35;
    }

    .top-info .status {
      margin-top: 10px;
      font-size: 12px;
      font-weight: 900;
      color: var(--muted2);
      text-transform: uppercase;
      letter-spacing: .6px;
    }

    .camera-wrap {
      position: absolute;
      left: 32px;
      right: 32px;
      top: 142px;
      height: 500px;
      display: flex;
      gap: 32px;
      z-index: 5;
      pointer-events: none;
    }

    .camera-box {
      position: relative;
      flex: 1 1 0;
      height: 500px;
      border: 3px solid var(--amarelo-borda);
      border-radius: 0;
      background: transparent;
      overflow: hidden;
      box-shadow: 0 12px 26px rgba(0,0,0,0.20);
    }

    .camera-label {
      position: absolute;
      top: 16px;
      left: 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      background: linear-gradient(135deg, #29d99a, #14b47a);
      color: #07131f;
      font-size: 22px;
      font-weight: 1000;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 10px 24px rgba(0,0,0,.25);
    }

    .camera-live {
      position: absolute;
      top: 16px;
      right: 16px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(8, 17, 30, 0.82);
      border: 1px solid rgba(241, 194, 50, 0.55);
      color: #fff;
      font-size: 18px;
      font-weight: 1000;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 10px 24px rgba(0,0,0,.25);
    }

    .camera-live::before {
      content: "";
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #21e38a;
      box-shadow: 0 0 10px rgba(33,227,138,.75);
      display: inline-block;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .boards {
      position: absolute;
      left: 32px;
      right: 32px;
      bottom: 28px;
      height: 378px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      z-index: 20;
      pointer-events: none;
    }

    .board-card {
      position: relative;
      border: 2px solid var(--amarelo-borda);
      border-radius: 28px;
      background: var(--card-bg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 18px 18px 16px;
      overflow: hidden;
    }

    .board-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
    }

    .board-title {
      font-size: 24px;
      font-weight: 1000;
      text-transform: uppercase;
      color: #ffd449;
      letter-spacing: .5px;
      line-height: 1.05;
    }

    .board-badge {
      flex: 0 0 auto;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(241,194,50,.75);
      background: rgba(255,255,255,0.08);
      color: #fff7cd;
      font-size: 15px;
      font-weight: 1000;
      text-transform: uppercase;
      letter-spacing: .8px;
    }

    .board-sub {
      font-size: 12px;
      font-weight: 900;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .table-head,
    .table-row {
      display: grid;
      grid-template-columns: 52px 1fr 115px 105px;
      align-items: center;
      gap: 10px;
    }

    .table-head {
      background: rgba(38, 217, 154, 0.18);
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 1000;
      text-transform: uppercase;
      color: #eef5ff;
      letter-spacing: .7px;
    }

    .rows {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .table-row {
      min-height: 45px;
      border-radius: 14px;
      padding: 8px 12px;
      background: var(--row-bg);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .table-row.top4 {
      border-color: rgba(255, 212, 59, 0.72);
      background: linear-gradient(90deg, rgba(255, 212, 59, 0.17), rgba(33, 209, 141, 0.12));
    }

    .pos {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffe27a, #e4b71c);
      color: #102037;
      font-size: 18px;
      font-weight: 1000;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
    }

    .name {
      font-size: 16px;
      font-weight: 900;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 6px;
    }

    .val,
    .avg {
      font-size: 17px;
      font-weight: 1000;
      text-align: right;
      color: #fff;
    }

    .avg {
      color: var(--amarelo);
    }

    .empty-state {
      height: 230px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      color: rgba(255,255,255,.85);
      font-size: 22px;
      font-weight: 1000;
      text-transform: uppercase;
      line-height: 1.3;
    }

    .card-footer {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: .6px;
    }

    .card-footer .dot {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .card-footer .dot::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1fe28a;
      box-shadow: 0 0 8px rgba(31,226,138,.7);
      display: inline-block;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .55; transform: scale(.82); }
    }
  </style>
</head>

<body>
  <div class="overlay">
    <div class="top-info">
      <div class="eyebrow">Circuito MT 2026</div>
      <div class="title">Etapa 2 • Rondonópolis</div>
      <div class="sub">Resultados por categoria</div>
      <div class="status" id="statusAtualizacao">Carregando dados…</div>
    </div>

    <div class="camera-wrap">
      <div class="camera-box">
        <div class="camera-label" id="cam1Label">Câmera 1</div>
        <div class="camera-live">Ao vivo</div>
      </div>

      <div class="camera-box">
        <div class="camera-label" id="cam2Label">Câmera 2</div>
      </div>
    </div>

    <div class="boards">
      <div class="board-card" id="card-m1"></div>
      <div class="board-card" id="card-m2"></div>
      <div class="board-card" id="card-f"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const CONFIG = {
      evento: params.get("evento") || "589",
      dia: params.get("dia") || "1",
      limite: Number(params.get("limite") || params.get("limit") || "5"),
      apiBase: (params.get("api") || "").replace(/\/$/, ""),
      refreshMs: Number(params.get("refresh") || "30000"),
      cam1: params.get("cam1") || "Câmera 1",
      cam2: params.get("cam2") || "Câmera 2"
    };

    document.getElementById("cam1Label").textContent = CONFIG.cam1;
    document.getElementById("cam2Label").textContent = CONFIG.cam2;

    const categorias = [
      { key: "masculino-1", nome: "1ª Divisão Masculina", cardId: "card-m1" },
      { key: "masculino-2", nome: "2ª Divisão Masculina", cardId: "card-m2" },
      { key: "feminino", nome: "1ª Divisão Feminina", cardId: "card-f" }
    ];

    const fallbackCircuito = {
      "masculino-1": [
        { posicao: 1, atleta: "Michel Belmonte", pontos: 100, maiorLinha: 224 },
        { posicao: 2, atleta: "Thiago Wandscher", pontos: 85, maiorLinha: 214 },
        { posicao: 3, atleta: "Nilo Ponce", pontos: 75, maiorLinha: 217 },
        { posicao: 4, atleta: "Matheus Verão", pontos: 65, maiorLinha: 232 },
        { posicao: 5, atleta: "Romildo Souza", pontos: 60, maiorLinha: 168 }
      ],
      "masculino-2": [
        { posicao: 1, atleta: "Gustavo Buzelle", pontos: 100, maiorLinha: 170 },
        { posicao: 2, atleta: "Ronaldo Oliveira", pontos: 85, maiorLinha: 168 },
        { posicao: 3, atleta: "Nelson Saga", pontos: 75, maiorLinha: 177 },
        { posicao: 4, atleta: "Gilberto Ribeiro", pontos: 65, maiorLinha: 177 },
        { posicao: 5, atleta: "Célio Belmonte", pontos: 60, maiorLinha: 208 }
      ],
      "feminino": [
        { posicao: 1, atleta: "Raquel Tenuta", pontos: 100, maiorLinha: 183 },
        { posicao: 2, atleta: "Josélia Moreno", pontos: 85, maiorLinha: 168 },
        { posicao: 3, atleta: "Edneia Miranda Saga", pontos: 75, maiorLinha: 158 },
        { posicao: 4, atleta: "Dani Ledur", pontos: 65, maiorLinha: 144 },
        { posicao: 5, atleta: "Agda Nogueira", pontos: 60, maiorLinha: 142 }
      ]
    };

    function formatMedia(valor) {
      const num = Number(valor || 0);
      return num.toFixed(2).replace(".", ",");
    }

    function normalizarAtleta(item, index) {
      return {
        posicao: Number(item.posicao || item.pos || index + 1),
        atleta: item.atleta || item.nome || item.nome_evento || item.nome_completo || "Atleta",
        total: Number(item.total || item.pontos_serie || item.pontos || 0),
        media: Number(item.media || item.m || 0),
        maiorLinha: Number(item.maiorLinha || item.maior_linha || item.ml || 0)
      };
    }

    function renderCard(categoria, atletas, modo) {
      const el = document.getElementById(categoria.cardId);
      const isFallback = modo !== "live";
      const badge = isFallback ? "Circuito" : "Top 5";
      const col3 = isFallback ? "Pts" : "Total";
      const col4 = isFallback ? "ML" : "Média";
      const subtitulo = isFallback ? "Classificação após a Etapa 1" : "Resultado oficial da Etapa 2";
      const footerLeft = isFallback ? "Fallback do circuito" : "Atualização automática";
      const footerRight = isFallback ? "Etapa 1 consolidada" : "Boliche Brasil";

      const rowsHtml = atletas.length
        ? atletas.slice(0, CONFIG.limite).map((item, index) => {
          const a = normalizarAtleta(item, index);
          const rowTop4 = a.posicao <= 4 ? "top4" : "";
          return `
            <div class="table-row ${rowTop4}">
              <div><span class="pos">${a.posicao}</span></div>
              <div class="name">${a.atleta}</div>
              <div class="val">${isFallback ? (item.pontos ?? a.total) : a.total}</div>
              <div class="avg">${isFallback ? (item.maiorLinha ?? a.maiorLinha) : formatMedia(a.media)}</div>
            </div>
          `;
        }).join("")
        : `<div class="empty-state">Aguardando dados da categoria</div>`;

      el.innerHTML = `
        <div class="board-head">
          <div class="board-title">${categoria.nome}</div>
          <div class="board-badge">${badge}</div>
        </div>
        <div class="board-sub">${subtitulo}</div>
        <div class="table-head">
          <div>#</div>
          <div>Atleta</div>
          <div style="text-align:right">${col3}</div>
          <div style="text-align:right">${col4}</div>
        </div>
        <div class="rows">${rowsHtml}</div>
        <div class="card-footer">
          <div class="dot">${footerLeft}</div>
          <div>${footerRight}</div>
        </div>
      `;
    }

    function getApiUrl(categoria) {
      if (!CONFIG.apiBase) return null;
      return `${CONFIG.apiBase}/api/top?evento=${encodeURIComponent(CONFIG.evento)}&categoria=${encodeURIComponent(categoria.key)}&dia=${encodeURIComponent(CONFIG.dia)}&limite=${encodeURIComponent(CONFIG.limite)}&_=${Date.now()}`;
    }

    async function carregarCategoria(categoria) {
      const url = getApiUrl(categoria);

      if (!url) {
        renderCard(categoria, fallbackCircuito[categoria.key] || [], "fallback");
        return "fallback";
      }

      try {
        const resp = await fetch(url, { cache: "no-store" });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const dados = await resp.json();

        if (dados && dados.status === "ok" && Array.isArray(dados.atletas) && dados.atletas.length) {
          renderCard(categoria, dados.atletas, "live");
          return "live";
        }

        renderCard(categoria, fallbackCircuito[categoria.key] || [], "fallback");
        return "fallback";
      } catch (erro) {
        renderCard(categoria, fallbackCircuito[categoria.key] || [], "fallback");
        return "fallback";
      }
    }

    async function carregarTudo() {
      const statusEl = document.getElementById("statusAtualizacao");
      statusEl.textContent = "Atualizando dados…";

      const modos = await Promise.all(categorias.map(carregarCategoria));
      const algumLive = modos.includes("live");

      if (algumLive) {
        statusEl.textContent = `Dia ${CONFIG.dia} • dados oficiais recebidos`;
      } else if (CONFIG.apiBase) {
        statusEl.textContent = "Sem dados da Etapa 2 • exibindo classificação do circuito";
      } else {
        statusEl.textContent = "Worker não informado • exibindo classificação do circuito";
      }
    }

    carregarTudo();
    setInterval(carregarTudo, CONFIG.refreshMs);
  </script>
</body>
</html>
