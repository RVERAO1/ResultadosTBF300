<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circuito MT 2026 - Etapa 2 - Prism Live</title>

  <style>
    :root {
      --amarelo: #ffd43b;
      --amarelo-borda: rgba(255, 212, 59, 0.94);
      --verde: #00d084;
      --branco: #ffffff;
      --cinza: #dce6ef;
      --cinza-2: #bfcad6;
      --sombra: rgba(0, 0, 0, 0.42);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--branco);
    }

    body { width: 1920px; height: 1080px; position: relative; }

    .overlay {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: transparent;
      overflow: hidden;
    }

    .top-left-logo {
      position: absolute;
      left: 36px;
      top: 26px;
      z-index: 30;
      width: 245px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(4, 20, 37, 0.76);
      border: 2px solid var(--amarelo-borda);
      border-radius: 18px;
      box-shadow: 0 12px 28px var(--sombra);
      padding: 10px 16px;
    }

    .logo-svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.45));
    }

    .event-info {
      position: absolute;
      right: 36px;
      top: 26px;
      z-index: 30;
      width: 420px;
      padding: 18px 22px;
      background: rgba(4, 20, 37, 0.78);
      border: 2px solid var(--amarelo-borda);
      border-radius: 18px;
      box-shadow: 0 12px 28px var(--sombra);
    }

    .event-title {
      font-size: 34px;
      line-height: 1;
      font-weight: 1000;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .event-subtitle {
      font-size: 15px;
      line-height: 1.25;
      font-weight: 900;
      color: var(--cinza);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .camera-stage {
      position: absolute;
      inset: 0;
      background: transparent;
      z-index: 1;
      pointer-events: none;
    }

    .camera-box {
      position: absolute;
      background: transparent;
      border: 3px solid var(--amarelo-borda);
      border-radius: 0;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.22), 0 12px 26px rgba(0, 0, 0, 0.20);
      overflow: hidden;
      pointer-events: none;
    }

    .cam-1 { left: 40px; top: 124px; width: 904px; height: 508px; }
    .cam-2 { left: 976px; top: 124px; width: 904px; height: 508px; }

    .camera-label {
      position: absolute;
      left: 12px;
      top: 10px;
      z-index: 3;
      padding: 8px 14px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(0, 208, 132, 0.92), rgba(0, 126, 89, 0.86));
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 8px 16px rgba(0,0,0,0.22);
      font-size: 12px;
      font-weight: 1000;
      color: #08131f;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .camera-live {
      position: absolute;
      right: 12px;
      top: 10px;
      z-index: 3;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(2, 16, 31, 0.72);
      border: 1px solid rgba(255, 212, 59, 0.75);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 1000;
      color: var(--branco);
      text-transform: uppercase;
      letter-spacing: 0.9px;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #00e676;
      box-shadow: 0 0 12px rgba(0, 230, 118, 0.95);
      animation: pulse 1.4s ease-in-out infinite;
      flex: 0 0 auto;
    }

    .results-wrapper {
      position: absolute;
      left: 36px;
      right: 36px;
      bottom: 26px;
      height: 388px;
      z-index: 20;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      pointer-events: none;
    }

    .result-card {
      position: relative;
      border: 2px solid var(--amarelo-borda);
      border-radius: 22px;
      background: radial-gradient(circle at top left, rgba(0, 208, 132, 0.10), transparent 24%), linear-gradient(135deg, rgba(2, 18, 34, 0.90), rgba(9, 38, 68, 0.78));
      box-shadow: 0 16px 32px var(--sombra);
      padding: 18px 18px 16px 18px;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 22px;
      font-weight: 1000;
      color: var(--amarelo);
      text-transform: uppercase;
      line-height: 1;
    }

    .card-badge {
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 212, 59, 0.8);
      background: rgba(255, 212, 59, 0.12);
      font-size: 11px;
      font-weight: 1000;
      color: var(--branco);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      white-space: nowrap;
    }

    .table-head, .table-row {
      display: grid;
      grid-template-columns: 48px 1fr 76px 76px;
      align-items: center;
      gap: 10px;
    }

    .table-head {
      padding: 10px 12px;
      border-radius: 14px;
      background: linear-gradient(90deg, rgba(0, 208, 132, 0.16), rgba(255, 212, 59, 0.08));
      margin-bottom: 8px;
      font-size: 11px;
      font-weight: 1000;
      color: var(--cinza);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .rows { display: flex; flex-direction: column; gap: 7px; min-height: 236px; }

    .table-row {
      padding: 10px 12px;
      border-radius: 14px;
      background: linear-gradient(90deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.07);
      min-height: 38px;
    }

    .table-row.top4 {
      border-color: rgba(255, 212, 59, 0.72);
      background: linear-gradient(90deg, rgba(255, 212, 59, 0.18), rgba(0, 208, 132, 0.13));
    }

    .pos-pill {
      min-width: 34px;
      height: 34px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #ffe066, #e0b400);
      color: #08131f;
      font-size: 18px;
      font-weight: 1000;
    }

    .col-name {
      font-size: 20px;
      font-weight: 900;
      color: var(--branco);
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .col-total, .col-media {
      font-size: 20px;
      font-weight: 1000;
      color: var(--branco);
      text-align: right;
      line-height: 1;
    }

    .col-media { color: var(--amarelo); }

    .card-footer {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 212, 59, 0.22);
      font-size: 10px;
      font-weight: 1000;
      color: var(--cinza-2);
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .status-ok { color: #8ef8bf; }
    .status-wait { color: #ffd97a; }

    .loading-note {
      min-height: 236px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 16px;
      font-size: 20px;
      font-weight: 1000;
      color: var(--cinza);
      line-height: 1.35;
      text-transform: uppercase;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.8); opacity: 0.55; }
    }
  </style>
</head>

<body>
  <div class="overlay">
    <div class="top-left-logo" aria-label="TBF300 Sports">
      <svg class="logo-svg" viewBox="0 0 520 170" role="img" aria-label="TBF300 Sports">
        <rect x="8" y="8" width="504" height="154" rx="22" fill="#061a31" stroke="#f4d03f" stroke-width="8"/>
        <text x="260" y="74" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="62" font-weight="900" fill="#ffffff" stroke="#0a1629" stroke-width="3">TBF300</text>
        <rect x="72" y="86" width="376" height="24" fill="#f04923"/>
        <text x="260" y="142" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="46" font-weight="900" fill="#ffffff" stroke="#0a1629" stroke-width="2">SPORTS</text>
      </svg>
    </div>

    <div class="event-info">
      <div class="event-title" id="eventTitle">Circuito MT 2026</div>
      <div class="event-subtitle" id="eventSubtitle">Etapa 2 • Rondonópolis</div>
    </div>

    <div class="camera-stage">
      <div class="camera-box cam-1">
        <div class="camera-label" id="cam1Label">Câmera 1</div>
        <div class="camera-live"><span class="live-dot"></span> Ao vivo</div>
      </div>

      <div class="camera-box cam-2">
        <div class="camera-label" id="cam2Label">Câmera 2</div>
        <div class="camera-live"><span class="live-dot"></span> Ao vivo</div>
      </div>
    </div>

    <div class="results-wrapper">
      <div class="result-card">
        <div class="card-header"><div class="card-title">1ª Divisão Masculina</div><div class="card-badge" id="badge-m1">Circuito</div></div>
        <div class="table-head"><div>#</div><div>Atleta</div><div style="text-align:right;">Pts</div><div style="text-align:right;">ML</div></div>
        <div class="rows" id="rows-m1"></div>
        <div class="card-footer"><span id="status-m1" class="status-wait">Etapa anterior</span><span id="update-m1">Circuito</span></div>
      </div>

      <div class="result-card">
        <div class="card-header"><div class="card-title">2ª Divisão Masculina</div><div class="card-badge" id="badge-m2">Circuito</div></div>
        <div class="table-head"><div>#</div><div>Atleta</div><div style="text-align:right;">Pts</div><div style="text-align:right;">ML</div></div>
        <div class="rows" id="rows-m2"></div>
        <div class="card-footer"><span id="status-m2" class="status-wait">Etapa anterior</span><span id="update-m2">Circuito</span></div>
      </div>

      <div class="result-card">
        <div class="card-header"><div class="card-title">1ª Divisão Feminina</div><div class="card-badge" id="badge-f1">Circuito</div></div>
        <div class="table-head"><div>#</div><div>Atleta</div><div style="text-align:right;">Pts</div><div style="text-align:right;">ML</div></div>
        <div class="rows" id="rows-f1"></div>
        <div class="card-footer"><span id="status-f1" class="status-wait">Etapa anterior</span><span id="update-f1">Circuito</span></div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const CONFIG = {
      evento: params.get("evento") || "589",
      dia: params.get("dia") || "1",
      limite: parseInt(params.get("limite") || params.get("limit") || "5", 10),
      etapa: params.get("etapa") || "Etapa 2",
      cidade: params.get("cidade") || "Rondonópolis",
      titulo: params.get("titulo") || "Circuito MT 2026",
      refreshMs: parseInt(params.get("refresh") || "15000", 10),
      cam1: params.get("cam1") || "Câmera 1",
      cam2: params.get("cam2") || "Câmera 2",
      apiBase: (params.get("api") || "").replace(/\/$/, "")
    };

    const FALLBACK_CIRCUITO = {
      "masculino-1": [
        { posicao: 1, atleta: "Michel Belmonte", pontos: 100, maiorLinha: 224 },
        { posicao: 2, atleta: "Thiago Wandscher", pontos: 85, maiorLinha: 221 },
        { posicao: 3, atleta: "NILO PONCE", pontos: 75, maiorLinha: 224 },
        { posicao: 4, atleta: "Matheus Verão", pontos: 65, maiorLinha: 232 },
        { posicao: 5, atleta: "Romildo Souza", pontos: 60, maiorLinha: 199 }
      ],
      "masculino-2": [
        { posicao: 1, atleta: "Gustavo Buzelle", pontos: 100, maiorLinha: 204 },
        { posicao: 2, atleta: "RONALDO OLIVEIRA", pontos: 85, maiorLinha: 201 },
        { posicao: 3, atleta: "Nelson Saga", pontos: 75, maiorLinha: 188 },
        { posicao: 4, atleta: "GUILHERME SCHEER", pontos: 65, maiorLinha: 225 },
        { posicao: 5, atleta: "GILBERTO RIBEIRO", pontos: 60, maiorLinha: 192 }
      ],
      "feminino": [
        { posicao: 1, atleta: "Raquel Tenuta", pontos: 100, maiorLinha: 201 },
        { posicao: 2, atleta: "Dani Ledur", pontos: 85, maiorLinha: 192 },
        { posicao: 3, atleta: "Agda Nogueira", pontos: 75, maiorLinha: 163 },
        { posicao: 4, atleta: "Joselia Moreno", pontos: 65, maiorLinha: 201 },
        { posicao: 5, atleta: "Tereza Belmonte", pontos: 60, maiorLinha: 162 }
      ]
    };

    const categorias = [
      { slug: "masculino-1", rowsId: "rows-m1", statusId: "status-m1", updateId: "update-m1", badgeId: "badge-m1" },
      { slug: "masculino-2", rowsId: "rows-m2", statusId: "status-m2", updateId: "update-m2", badgeId: "badge-m2" },
      { slug: "feminino", rowsId: "rows-f1", statusId: "status-f1", updateId: "update-f1", badgeId: "badge-f1" }
    ];

    const ultimoValido = {};

    document.getElementById("eventTitle").textContent = CONFIG.titulo;
    document.getElementById("eventSubtitle").textContent = `${CONFIG.etapa} • ${CONFIG.cidade}`;
    document.getElementById("cam1Label").textContent = CONFIG.cam1;
    document.getElementById("cam2Label").textContent = CONFIG.cam2;

    function formatHora(isoString) {
      if (!isoString) return "--:--:--";
      const d = new Date(isoString);
      if (Number.isNaN(d.getTime())) return "--:--:--";
      return d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    function renderRows(rowsEl, atletas) {
      rowsEl.innerHTML = atletas.slice(0, CONFIG.limite).map((item, index) => {
        const posicao = item.posicao || index + 1;
        const atleta = item.atleta || item.nome || "Atleta";
        const pontos = item.pontos ?? item.pontosCircuito ?? item.total ?? 0;
        const maiorLinha = item.maiorLinha ?? item.maior_linha ?? item.ml ?? "-";
        const top4 = posicao <= 4 ? "top4" : "";

        return `
          <div class="table-row ${top4}">
            <div><span class="pos-pill">${posicao}</span></div>
            <div class="col-name" title="${atleta}">${atleta}</div>
            <div class="col-total">${pontos}</div>
            <div class="col-media">${maiorLinha}</div>
          </div>
        `;
      }).join("");
    }

    function usarFallback(cat, motivo = "Classificação após Etapa 1") {
      const rowsEl = document.getElementById(cat.rowsId);
      const statusEl = document.getElementById(cat.statusId);
      const updateEl = document.getElementById(cat.updateId);
      const badgeEl = document.getElementById(cat.badgeId);
      const dados = ultimoValido[cat.slug] || FALLBACK_CIRCUITO[cat.slug] || [];

      renderRows(rowsEl, dados);
      statusEl.textContent = ultimoValido[cat.slug] ? "Última atualização válida" : motivo;
      statusEl.className = "status-wait";
      updateEl.textContent = ultimoValido[cat.slug] ? "Boliche Brasil" : "Circuito";
      badgeEl.textContent = ultimoValido[cat.slug] ? "Ao vivo" : "Etapa 1";
    }

    async function carregarCategoria(cat) {
      const rowsEl = document.getElementById(cat.rowsId);
      const statusEl = document.getElementById(cat.statusId);
      const updateEl = document.getElementById(cat.updateId);
      const badgeEl = document.getElementById(cat.badgeId);

      const url = `${CONFIG.apiBase}/api/top?evento=${encodeURIComponent(CONFIG.evento)}&categoria=${encodeURIComponent(cat.slug)}&dia=${encodeURIComponent(CONFIG.dia)}&limite=${encodeURIComponent(CONFIG.limite)}&_=${Date.now()}`;

      try {
        const resposta = await fetch(url, { cache: "no-store" });
        if (!resposta.ok) throw new Error("Falha HTTP");

        const dados = await resposta.json();
        const atletas = Array.isArray(dados.atletas) ? dados.atletas : [];

        if (dados.status === "ok" && atletas.length > 0) {
          ultimoValido[cat.slug] = atletas;
          renderRows(rowsEl, atletas);
          statusEl.textContent = "Etapa 2 ao vivo";
          statusEl.className = "status-ok";
          updateEl.textContent = formatHora(dados.atualizadoEm);
          badgeEl.textContent = "Ao vivo";
          return;
        }

        usarFallback(cat);
      } catch (erro) {
        usarFallback(cat);
      }
    }

    async function carregarTudo() {
      await Promise.all(categorias.map(cat => carregarCategoria(cat)));
    }

    carregarTudo();
    setInterval(carregarTudo, CONFIG.refreshMs);
  </script>
</body>
</html>
