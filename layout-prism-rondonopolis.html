<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Circuito MT 2026 • Etapa 2 • Rondonópolis</title>

  <style>
    :root {
      --amarelo: #ffd43b;
      --amarelo-borda: rgba(255, 212, 59, 0.94);
      --verde: #21d18d;
      --texto: #f7f9fd;
      --muted: rgba(255,255,255,0.78);
      --muted2: rgba(255,255,255,0.58);
      --card-bg: linear-gradient(135deg, rgba(8,22,44,0.94), rgba(31,53,84,0.88));
      --row-bg: rgba(255,255,255,0.060);
      --shadow: 0 16px 34px rgba(0,0,0,0.34);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      font-family: Arial, Helvetica, sans-serif;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      color: var(--texto);
    }

    body {
      position: relative;
    }

    .viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
    }

    .overlay {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1920px;
      height: 1080px;
      transform: translate(-50%, -50%) scale(var(--scale, 1));
      transform-origin: center center;
      background: transparent;
      overflow: hidden;
    }

    .top-info {
      position: absolute;
      top: 28px;
      right: 40px;
      width: 500px;
      min-height: 112px;
      padding: 18px 22px;
      border: 2px solid var(--amarelo-borda);
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(9,18,35,.92), rgba(33,56,93,.86));
      box-shadow: var(--shadow);
      z-index: 20;
    }

    .top-info .eyebrow {
      font-size: 18px;
      line-height: 1;
      font-weight: 900;
      color: var(--amarelo);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .top-info .title {
      font-size: 29px;
      font-weight: 900;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-info .sub {
      font-size: 14px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: .4px;
      text-transform: uppercase;
      line-height: 1.3;
    }

    .top-info .status {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 800;
      color: var(--muted2);
      text-transform: uppercase;
      letter-spacing: .6px;
    }

    .camera-wrap {
      position: absolute;
      left: 58px;
      right: 58px;
      top: 140px;
      height: 505px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 34px;
      z-index: 5;
    }

    .camera-box {
      position: relative;
      width: 100%;
      height: 505px;
      border: 3px solid var(--amarelo-borda);
      border-radius: 0;
      background: transparent;
      overflow: hidden;
      box-shadow: 0 12px 26px rgba(0,0,0,0.20);
    }

    .camera-label {
      position: absolute;
      top: 16px;
      left: 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      background: linear-gradient(135deg, #29d99a, #14b47a);
      color: #07131f;
      font-size: 19px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 10px 24px rgba(0,0,0,.25);
    }

    .camera-live {
      position: absolute;
      top: 16px;
      right: 16px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(8, 17, 30, 0.82);
      border: 1px solid rgba(241, 194, 50, 0.55);
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 10px 24px rgba(0,0,0,.25);
    }

    .camera-live::before {
      content: "";
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #21e38a;
      box-shadow: 0 0 10px rgba(33,227,138,.75);
      display: inline-block;
    }

    .boards {
      position: absolute;
      left: 58px;
      right: 58px;
      bottom: 30px;
      height: 385px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      z-index: 10;
    }

    .board-card {
      position: relative;
      height: 385px;
      border: 2px solid var(--amarelo-borda);
      border-radius: 22px;
      background: var(--card-bg);
      box-shadow: var(--shadow);
      padding: 18px 18px 14px;
      overflow: hidden;
    }

    .board-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 12px;
    }

    .board-title {
      font-size: 24px;
      font-weight: 900;
      text-transform: uppercase;
      color: #ffd449;
      letter-spacing: .4px;
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .board-badge {
      flex: 0 0 auto;
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid rgba(241,194,50,.75);
      background: rgba(255,255,255,0.08);
      color: #fff7cd;
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .7px;
    }

    .board-sub {
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .table-head,
    .table-row {
      display: grid;
      grid-template-columns: 48px 1fr 95px 85px;
      align-items: center;
      gap: 10px;
    }

    .table-head {
      background: rgba(38, 217, 154, 0.18);
      border-radius: 13px;
      padding: 9px 11px;
      margin-bottom: 9px;
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      color: #eef5ff;
      letter-spacing: .7px;
    }

    .rows {
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-height: 230px;
    }

    .table-row {
      min-height: 43px;
      border-radius: 13px;
      padding: 7px 11px;
      background: var(--row-bg);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .pos {
      width: 31px;
      height: 31px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffe27a, #e4b71c);
      color: #102037;
      font-size: 17px;
      font-weight: 900;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
    }

    .name {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 4px;
    }

    .val,
    .avg {
      font-size: 17px;
      font-weight: 900;
      text-align: right;
      color: #fff;
    }

    .avg {
      color: var(--amarelo);
    }

    .empty-state {
      height: 230px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      color: rgba(255,255,255,.85);
      font-size: 20px;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.3;
    }

    .card-footer {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: .6px;
      border-top: 1px solid rgba(255, 212, 59, 0.18);
      padding-top: 8px;
    }

    .card-footer .live-dot {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .card-footer .live-dot::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1fe28a;
      box-shadow: 0 0 8px rgba(31,226,138,.7);
      display: inline-block;
      flex: 0 0 auto;
    }

    @media (max-aspect-ratio: 16/9) {
      .overlay {
        transform: translate(-50%, -50%) scale(var(--scale, 1));
      }
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="overlay" id="overlay">
      <div class="top-info">
        <div class="eyebrow">Circuito MT 2026</div>
        <div class="title">Etapa 2 • Rondonópolis</div>
        <div class="sub">Resultados por categoria</div>
        <div class="status" id="statusAtualizacao">Carregando dados…</div>
      </div>

      <div class="camera-wrap">
        <div class="camera-box">
          <div class="camera-label" id="cam1Label">Câmera 1</div>
          <div class="camera-live">Ao vivo</div>
        </div>

        <div class="camera-box">
          <div class="camera-label" id="cam2Label">Câmera 2</div>
        </div>
      </div>

      <div class="boards">
        <div class="board-card" id="card-m1"></div>
        <div class="board-card" id="card-m2"></div>
        <div class="board-card" id="card-f"></div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const CONFIG = {
      evento: params.get("evento") || "589",
      dia: params.get("dia") || "1",
      limite: Number(params.get("limite") || "5"),
      apiBase: (params.get("api") || "").replace(/\/$/, ""),
      cam1: params.get("cam1") || "Câmera 1",
      cam2: params.get("cam2") || "Câmera 2"
    };

    const categorias = [
      { key: "masculino-1", nome: "1ª Divisão Masculina", cardId: "card-m1" },
      { key: "masculino-2", nome: "2ª Divisão Masculina", cardId: "card-m2" },
      { key: "feminino", nome: "1ª Divisão Feminina", cardId: "card-f" }
    ];

    const fallbackCircuito = {
      "masculino-1": [
        { posicao: 1, atleta: "Michel Belmonte", pontos: 100, maiorLinha: 224 },
        { posicao: 2, atleta: "Thiago Wandscher", pontos: 85, maiorLinha: 214 },
        { posicao: 3, atleta: "Nilo Ponce", pontos: 75, maiorLinha: 217 },
        { posicao: 4, atleta: "Matheus Verão", pontos: 65, maiorLinha: 232 },
        { posicao: 5, atleta: "Romildo Souza", pontos: 60, maiorLinha: 168 }
      ],
      "masculino-2": [
        { posicao: 1, atleta: "Gustavo Buzelle", pontos: 100, maiorLinha: 170 },
        { posicao: 2, atleta: "Ronaldo Oliveira", pontos: 85, maiorLinha: 168 },
        { posicao: 3, atleta: "Nelson Saga", pontos: 75, maiorLinha: 177 },
        { posicao: 4, atleta: "Gilberto Ribeiro", pontos: 65, maiorLinha: 177 },
        { posicao: 5, atleta: "Célio Belmonte", pontos: 60, maiorLinha: 208 }
      ],
      "feminino": [
        { posicao: 1, atleta: "Raquel Tenuta", pontos: 100, maiorLinha: 183 },
        { posicao: 2, atleta: "Josélia Moreno", pontos: 85, maiorLinha: 168 },
        { posicao: 3, atleta: "Edneia Miranda Saga", pontos: 75, maiorLinha: 158 },
        { posicao: 4, atleta: "Dani Ledur", pontos: 65, maiorLinha: 144 },
        { posicao: 5, atleta: "Agda Nogueira", pontos: 60, maiorLinha: 142 }
      ]
    };

    document.getElementById("cam1Label").textContent = CONFIG.cam1;
    document.getElementById("cam2Label").textContent = CONFIG.cam2;

    function ajustarEscala() {
      const escala = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      document.documentElement.style.setProperty("--scale", escala);
    }

    window.addEventListener("resize", ajustarEscala);
    ajustarEscala();

    function formatMedia(valor) {
      const num = Number(valor || 0);
      return num.toFixed(2).replace(".", ",");
    }

    function renderCard(categoria, payload, modo = "live") {
      const el = document.getElementById(categoria.cardId);
      const atletas = Array.isArray(payload) ? payload : [];
      const isFallback = modo === "fallback";
      const badge = isFallback ? "Circuito" : "Top 5";
      const col3 = isFallback ? "Pts" : "Total";
      const col4 = isFallback ? "ML" : "Média";

      const rowsHtml = atletas.length
        ? atletas.map(item => `
          <div class="table-row">
            <div><span class="pos">${item.posicao}</span></div>
            <div class="name">${item.atleta}</div>
            <div class="val">${isFallback ? item.pontos : item.total}</div>
            <div class="avg">${isFallback ? item.maiorLinha : formatMedia(item.media)}</div>
          </div>
        `).join("")
        : `<div class="empty-state">Aguardando dados da categoria</div>`;

      el.innerHTML = `
        <div class="board-head">
          <div class="board-title">${categoria.nome}</div>
          <div class="board-badge">${badge}</div>
        </div>
        <div class="board-sub">${isFallback ? "Classificação após a Etapa 1" : "Resultado automático da etapa atual"}</div>
        <div class="table-head">
          <div>#</div>
          <div>Atleta</div>
          <div style="text-align:right">${col3}</div>
          <div style="text-align:right">${col4}</div>
        </div>
        <div class="rows">${rowsHtml}</div>
        <div class="card-footer">
          <div class="live-dot">${isFallback ? "Circuito após Etapa 1" : "Atualização automática"}</div>
          <div>${isFallback ? "Fallback" : "Boliche Brasil"}</div>
        </div>
      `;
    }

    async function carregarCategoria(categoria) {
      if (!CONFIG.apiBase) {
        renderCard(categoria, fallbackCircuito[categoria.key] || [], "fallback");
        return { modo: "fallback" };
      }

      const url = `${CONFIG.apiBase}/api/top?evento=${CONFIG.evento}&categoria=${categoria.key}&dia=${CONFIG.dia}&limite=${CONFIG.limite}`;

      try {
        const resp = await fetch(url, { cache: "no-store" });
        if (!resp.ok) throw new Error("Falha HTTP");
        const dados = await resp.json();

        if (dados && dados.status === "ok" && Array.isArray(dados.atletas) && dados.atletas.length) {
          renderCard(categoria, dados.atletas, "live");
          return { modo: "live" };
        }

        renderCard(categoria, fallbackCircuito[categoria.key] || [], "fallback");
        return { modo: "fallback" };
      } catch (e) {
        renderCard(categoria, fallbackCircuito[categoria.key] || [], "fallback");
        return { modo: "fallback" };
      }
    }

    async function carregarTudo() {
      const statusEl = document.getElementById("statusAtualizacao");
      statusEl.textContent = "Atualizando…";

      const resultados = await Promise.all(categorias.map(carregarCategoria));
      const algumLive = resultados.some(r => r.modo === "live");

      statusEl.textContent = algumLive
        ? `Dia ${CONFIG.dia} • dados oficiais recebidos`
        : "Exibindo classificação após a Etapa 1";
    }

    carregarTudo();
    setInterval(carregarTudo, 30000);
  </script>
</body>
</html>
