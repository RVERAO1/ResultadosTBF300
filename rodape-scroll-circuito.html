      async function consultarControle(){

        try{const url=new URL(`${CONFIG.apiBase}/api/control/state`);if(!CONFIG.forcarPlacar){url.searchParams.set("client",clienteId);url.searchParams.set("revision",controle.revision);url.searchParams.set("mode",controle.mode==="oculto"?"oculto":modoAtual);url.searchParams.set("imageReady",imagemCarregada?"1":"0");url.searchParams.set("audioReady",youtubeReady?"1":"0");url.searchParams.set("audioState",audioPlayerState)}
          const resposta=await fetch(url,{cache:"no-store",signal:abort.signal});if(!resposta.ok)return;const novo=await resposta.json();if(!["auto","rodape","placar","oculto"].includes(novo.mode)||!Number.isFinite(novo.revision))return;

      async function buscarCategoria(categoria){

      function ajustarVelocidadeScroll(forcar=false){
        const track=document.querySelector(".track"),grupo=document.getElementById("groupA");if(!track||!grupo)return;
        const base=Math.max(40,Math.min(180,Number(controle.scrollDuration)||CONFIG.duracao));
        const largura=Math.max(1920,grupo.scrollWidth||1920);
        const duracao=Math.max(20,base*(largura/1920)).toFixed(1)+"s";
        if(!forcar&&tickerDuration===duracao&&track.classList.contains("running"))return;
        tickerDuration=duracao;
        document.documentElement.style.setProperty("--duracao",duracao);
        track.classList.remove("running");void track.offsetWidth;
        window.requestAnimationFrame(()=>window.requestAnimationFrame(()=>track.classList.add("running")));
      }
      function renderizarTicker(){
        const temResultados=resultadosAtuais.some(resultado=>resultado.live&&!resultado.demo&&resultado.atletas.length>0);
        const apoio=`<span class="credits">Realização BolicheMT • Apoio SECEL-MT • Transmissão TBF300 Sports</span><span class="separator"></span>`;
        const fallback=[
          "CIRCUITO MT 2026 • 4ª ETAPA • CUIABÁ • 07 E 08/11 • BOLICHE BEIRA RIO • TRANSMISSÃO TBF300 SPORTS",
          "30 ATLETAS CONFIRMADOS • MASCULINO A: 13 • MASCULINO B: 9 • FEMININO: 8",
          "FINAIS • MODELO STEPLADDER PWBA • JOGO 1: 4º x 3º • JOGO 2: VENCEDOR DO JOGO 1 x 2º • JOGO 3: VENCEDOR DO JOGO 2 x 1º • MELHOR DE 3 PARTIDAS",
          "REGRAS DAS FINAIS • AS TRÊS DIVISÕES DISPUTAM CADA FASE SIMULTANEAMENTE • A PRÓXIMA FASE SÓ COMEÇA APÓS A CONCLUSÃO DAS TRÊS DIVISÕES • QUEM VENCER POR 2 A 0 AGUARDA OS DEMAIS CONFRONTOS • EMPATE NA PARTIDA: VITÓRIA DO MELHOR CLASSIFICADO NO RANKING DO CIRCUITO",
          "RANKING APÓS A 3ª ETAPA • MASCULINO A • 1º MATHEUS VERÃO 240 • 2º ANTONIO TOLEDO 225 • 3º GUI PONCE 180 • 4º MOREIRA ÁVILA 175 • 5º MICHEL BELMONTE 155 • 6º NILO PONCE 135 • 7º ROMILDO SOUZA 110 • 8º THIAGO WANDSCHER 85",
          "RANKING APÓS A 3ª ETAPA • MASCULINO B • 1º GUSTAVO BUZELLE 250 • 2º GILBERTO RIBEIRO 225 • 3º NELSON SAGA 205 • 4º NELSON MARQUES 195 • 5º RONALDO OLIVEIRA 180 • 6º CÉLIO BELMONTE 155 • 7º ADELMO NOIMANN 125 • 8º GUILHERME SCHEER 110",
          "RANKING APÓS A 3ª ETAPA • FEMININO • 1ª RAQUEL TENUTA 285 • 2ª EDNÉIA MIRANDA SAGA 205 • 3ª JOSÉLIA MORENO 165 • 4ª AGDA NOGUEIRA 150 • 5ª DANIELLE LEDUR 145 • 6ª ADRIANA TAVEIRA 100 • 7ª TEREZA BELMONTE 60 • 8ª BET TEIXEIRA 55"
        ].map(texto=>`<span class="credits">${escapeHtml(texto)}</span><span class="separator"></span>`).join("");
        const confrontos=temResultados?renderizarConfrontosFinais():"";
        const conteudo=temResultados?resultadosAtuais.map(renderizarCategoriaTicker).join("")+confrontos+apoio:fallback+apoio;
        const mensagem=controle.message?`<span class="credits">${escapeHtml(controle.message)}</span><span class="separator"></span>`:"";
        const final=mensagem&&controle.messageMode==="replace"?mensagem+apoio:conteudo+mensagem;
        const mudouConteudo=final!==tickerSignature;
        if(mudouConteudo){
          tickerSignature=final;
          document.getElementById("groupA").innerHTML=final;
          document.getElementById("groupB").innerHTML=final;
          ajustarVelocidadeScroll(true);
        }else{
          ajustarVelocidadeScroll(false);
        }
      }
      function diaAtualDoEvento(){return Math.max(1,...resultadosAtuais.filter(resultado=>resultado.live).map(resultado=>resultado.dia||1))}
      function valorJogo(atleta,linha,diaExibicao){if(!atleta||atleta.dia!==diaExibicao)return "—";const jogo=atleta.jogos.find(item=>item.linha===linha);return jogo?.pontos||"—"}
      function linhasTabela(resultado,diaExibicao,numeroGrupo){
        const linhas=linhasDoDia(diaExibicao);const inicio=numeroGrupo*3;const atletas=resultado.atletas.slice(inicio,inicio+3);
        return Array.from({length:3},(_,indice)=>{const atleta=atletas[indice];const posicao=atleta?.posicao||inicio+indice+1;if(!atleta)return `<tr class="empty-row"><td><span class="pos-badge">${posicao}</span></td><td class="name">—</td>${linhas.map(()=>"<td>—</td>").join("")}<td class="total">—</td><td class="average">—</td></tr>`;return `<tr><td><span class="pos-badge">${escapeHtml(posicao)}</span></td><td class="name">${escapeHtml(atleta.atleta)}</td>${linhas.map(linha=>`<td class="game">${escapeHtml(valorJogo(atleta,linha,diaExibicao))}</td>`).join("")}<td class="total">${escapeHtml(atleta.total)}</td><td class="average">${escapeHtml(formatarMedia(atleta.media))}</td></tr>`}).join("")
      }
      function renderizarQuadros(){
        const diaExibicao=diaAtualDoEvento();const linhas=linhasDoDia(diaExibicao);
        const totalGrupos=Math.max(1,...resultadosAtuais.map(resultado=>Math.ceil(resultado.atletas.length/3)));const numeroGrupo=((grupoAtual<0?0:grupoAtual)%totalGrupos);const inicio=numeroGrupo*3+1;const fim=inicio+2;
        document.getElementById("cards").innerHTML=resultadosAtuais.map(resultado=>{const situacao=resultado.demo?"Teste visual • API evento 589":resultado.live?`Atualização automática • Dia ${diaExibicao}`:"Aguardando categoria";const classe=resultado.live?"live-dot":"live-dot waiting";return `<article class="result-card"><header class="card-head"><h2 class="card-title">${escapeHtml(resultado.categoria.nome)}</h2><div class="card-subtitle"><span>${inicio}º ao ${fim}º • Dia ${diaExibicao} • T/M acumulados</span><span class="${classe}">${escapeHtml(situacao)}</span></div></header><table class="results-table"><thead><tr><th class="pos">#</th><th class="name">Atleta</th>${linhas.map(linha=>`<th class="game">L${linha}</th>`).join("")}<th class="total" title="Total acumulado">T</th><th class="average" title="Média acumulada">M</th></tr></thead><tbody>${linhasTabela(resultado,diaExibicao,numeroGrupo)}</tbody></table></article>`}).join("")
      }
      function definirModo(modo){if(modoAtual===modo)return;modoAtual=modo;document.body.classList.toggle("modo-placar",modo==="placar");document.body.classList.toggle("modo-rodape",modo!=="placar")}
      function temResultadosParaExibir(){return resultadosAtuais.some(resultado=>resultado.live&&resultado.atletas.length>0)}
      function aplicarGrupo(novoGrupo){if(novoGrupo===grupoAtual)return;grupoAtual=novoGrupo;renderizarQuadros()}
      function aplicarCiclo(){
        const temResultados=temResultadosParaExibir();
        if(controle.mode==="oculto"||controle.mode==="rodape"){definirModo("rodape");grupoAtual=-1;return}
        if(controle.mode==="placar"){if(!temResultados){definirModo("rodape");return}definirModo("placar");aplicarGrupo(Math.floor((Date.now()-inicioManual)/15000));return}
        if(CONFIG.forcarPlacar){if(!temResultados){definirModo("rodape");return}definirModo("placar");aplicarGrupo(Math.floor((Date.now()-cycleStartedAt)/15000));return}
        const agora=Date.now();
        if(estado.inicioPlacar&&agora-estado.inicioPlacar>=CONFIG.placarMs){estado.inicioPlacar=0;salvarEstado()}
        if(!estado.inicioPlacar&&linhaConfirmada>estado.ultimaLinha&&temResultados){estado.ultimaLinha=linhaConfirmada;estado.inicioPlacar=agora;grupoAtual=-1;salvarEstado()}
        const exibir=!!estado.inicioPlacar&&temResultados;
        definirModo(exibir?"placar":"rodape");if(exibir)aplicarGrupo(Math.floor((agora-estado.inicioPlacar)/15000));else grupoAtual=-1
      }
      async function atualizar(){if(atualizando)return;atualizando=true;try{const novos=await Promise.all(CATEGORIAS.map(buscarCategoria));resultadosAtuais=novos.map((novo,indice)=>{const anterior=resultadosAtuais[indice];return anterior?.live&&(!novo.live||(anterior.dia||0)>(novo.dia||0))?{...anterior,consultaValida:false}:novo});confirmarLinha(resultadosAtuais);renderizarTicker();renderizarQuadros();aplicarCiclo()}finally{atualizando=false}}
      async function verificarVersao(){try{const resposta=await fetch(`${window.location.pathname}?_versao=${Date.now()}`,{cache:"no-store"});const html=await resposta.text();const versao=html.match(/const BUILD_ID="([^"]+)"/);if(versao&&versao[1]!==BUILD_ID){const destino=new URL(window.location.href);destino.searchParams.set("_build",versao[1]);window.location.replace(destino.toString())}}catch(erro){}}
      if(params.get("_build")!==BUILD_ID){const destino=new URL(window.location.href);destino.searchParams.set("_build",BUILD_ID);window.location.replace(destino.toString());return}
      cycleStartedAt=Date.now();carregarYoutubeApi();aplicarPosicaoScroll();aplicarImagem();renderizarTicker();renderizarQuadros();aplicarCiclo();atualizar();consultarControle();window.setInterval(consultarControle,5000);window.setInterval(atualizar,CONFIG.refreshMs);window.setInterval(aplicarCiclo,500);window.setInterval(verificarVersao,60000)
    })();
  </script>
