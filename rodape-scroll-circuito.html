<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Circuito MT 2026 • Rodapé e Resultados</title>
  <style>
    :root{--amarelo:#ffd43b;--ouro:#d9b943;--verde:#21d18d;--texto:#fff;--muted:rgba(255,255,255,.72);--duracao:72s}
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
    html,body{width:100%;height:100%;overflow:hidden;background:transparent!important}
    body{color:var(--texto)}
    .ticker{position:fixed;right:0;bottom:0;left:0;z-index:10;height:94px;display:flex;align-items:center;overflow:hidden;color:var(--texto);background:transparent;opacity:1;visibility:visible;transform:translateY(0);transition:opacity .45s ease,transform .7s cubic-bezier(.22,.8,.25,1),visibility .7s}
    body.modo-placar .ticker{opacity:0;visibility:hidden;transform:translateY(115%);pointer-events:none}
    .viewport{display:flex;align-items:center;width:100%;height:88px;overflow:hidden}
    .track{display:inline-flex;align-items:center;width:max-content;min-width:max-content;white-space:nowrap;will-change:transform;transform:translate3d(0,0,0);animation:none}
    .track.running{animation:scroll var(--duracao) linear infinite!important;animation-play-state:running!important}
    .group{display:inline-flex;align-items:center;flex:0 0 auto}
    .category,.ranking,.credits{display:inline-flex;align-items:center;flex:0 0 auto;height:88px;text-transform:uppercase;text-shadow:0 2px 5px rgba(0,0,0,.95),0 0 2px rgba(0,0,0,.9)}
    .category{padding:0 26px 0 32px;font-size:18px;font-weight:900;color:#87f2c3;letter-spacing:.45px}
    .ranking{gap:8px;padding:0 23px;font-size:18px;font-weight:900;letter-spacing:.3px}
    .position{color:var(--amarelo)}.athlete{color:#fff}.details{font-size:14px;color:var(--muted)}
    .credits{padding:0 32px;font-size:17px;font-weight:900;color:#fff;letter-spacing:.55px}
    .separator{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--verde);box-shadow:0 0 12px rgba(33,209,141,.75)}
    .results-dock{position:fixed;right:0;bottom:0;left:0;z-index:20;height:245px;padding:9px 22px 5px;overflow:hidden;background:linear-gradient(180deg,rgba(2,15,31,.91),rgba(1,12,27,.98));border-top:2px solid rgba(217,185,67,.9);box-shadow:0 -18px 48px rgba(0,0,0,.5);transform:translateY(105%);opacity:0;visibility:hidden;transition:transform .9s cubic-bezier(.18,.82,.23,1),opacity .45s ease,visibility .9s;pointer-events:none}
    body.modo-placar .results-dock{transform:translateY(0);opacity:1;visibility:visible}
    .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;height:202px}
    .result-card{min-width:0;overflow:hidden;border:2px solid rgba(217,185,67,.92);border-radius:18px;background:linear-gradient(145deg,rgba(9,31,55,.97),rgba(10,27,49,.95));box-shadow:inset 0 0 30px rgba(22,76,105,.12),0 8px 24px rgba(0,0,0,.24)}
    .card-head{height:52px;padding:7px 13px 5px;border-bottom:1px solid rgba(255,255,255,.09)}
    .card-title{color:#e6c54d;font-size:17px;font-weight:950;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .card-subtitle{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-top:4px;color:rgba(255,255,255,.68);font-size:8px;font-weight:850;letter-spacing:.75px;text-transform:uppercase}
    .live-dot{display:inline-flex;align-items:center;gap:6px;color:#7ce6bb;white-space:nowrap}.live-dot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--verde);box-shadow:0 0 8px rgba(33,209,141,.8)}
    .waiting{color:#e6c54d}.waiting::before{background:#e6c54d;box-shadow:0 0 8px rgba(230,197,77,.7)}
    .results-table{width:100%;border-collapse:separate;border-spacing:0 3px;table-layout:fixed;padding:0 8px}
    .results-table th{height:21px;color:rgba(255,255,255,.68);background:rgba(18,96,95,.42);font-size:9px;font-weight:900;letter-spacing:.4px;text-align:center;text-transform:uppercase}
    .results-table th:first-child{border-radius:9px 0 0 9px}.results-table th:last-child{border-radius:0 9px 9px 0}
    .results-table th.name,.results-table td.name{text-align:left}
    .results-table tbody tr{background:rgba(255,255,255,.055)}
    .results-table td{height:36px;padding:0 3px;color:#fff;font-size:12px;font-weight:800;text-align:center;border-top:1px solid rgba(255,255,255,.035);border-bottom:1px solid rgba(255,255,255,.035)}
    .results-table td:first-child{border-radius:10px 0 0 10px}.results-table td:last-child{border-radius:0 10px 10px 0}
    .results-table .pos{width:38px}.results-table .name{width:31%;padding-left:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .results-table .game{width:7.2%;color:rgba(255,255,255,.86)}.results-table .total{width:9%;color:#f0d15a;font-size:13px;font-weight:950}.results-table .average{width:10%;color:#8aeac4}
    .pos-badge{display:inline-flex;align-items:center;justify-content:center;width:27px;height:25px;border-radius:7px;color:#122033;background:linear-gradient(145deg,#f0d15a,#bd972e);font-size:12px;font-weight:950}
    .empty-row td{color:rgba(255,255,255,.25)}.empty-row .name{font-weight:650}
    .dock-foot{height:28px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 5px;color:rgba(255,255,255,.8);font-size:9px;font-weight:850;letter-spacing:.55px;text-transform:uppercase}
    .dock-foot .event{color:#e6c54d}.dock-foot .support{text-align:right}
    @keyframes scroll{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
    @media(max-width:1250px){.results-dock{height:235px;padding:7px 10px 4px}.cards{height:196px;gap:7px}.card-head{height:50px;padding:6px 8px 4px}.card-title{font-size:14px}.card-subtitle{font-size:7px}.results-table{padding:0 4px;border-spacing:0 2px}.results-table td{height:35px;font-size:10px}.results-table th{font-size:7px}.results-table .pos{width:32px}.pos-badge{width:23px;height:23px;font-size:11px}.dock-foot{height:26px;font-size:8px}}
  </style>
</head>
<body class="modo-rodape">
  <footer class="ticker" aria-label="Classificação do Circuito MT 2026"><div class="viewport"><div class="track"><div class="group" id="groupA"></div><div class="group" id="groupB" aria-hidden="true"></div></div></div></footer>
  <section class="results-dock" aria-live="polite" aria-label="Resultados do Circuito MT 2026">
    <div class="cards" id="cards"></div>
    <footer class="dock-foot"><span class="event">Circuito MT 2026 • Evento 590 • Etapa 3 • Campo Novo dos Parecis</span><span class="support">Realização BolicheMT - Apoio SECEL-MT - Transmissão TBF300 Sports</span></footer>
  </section>
  <script>
    (()=>{
      "use strict";
      const BUILD_ID="20261007-evento590-dock-v7-teste-1min";
      const params=new URLSearchParams(window.location.search);
      const numeroPositivo=(nome,padrao,minimo)=>{const valor=Number(params.get(nome));return Number.isFinite(valor)&&valor>=minimo?valor:padrao};
      const CONFIG={evento:params.get("evento")||"590",dia:params.get("dia")||"auto",apiBase:(params.get("api")||"https://noisy-sea-5a8a.rverao1.workers.dev").replace(/\/$/,""),refreshMs:Math.max(10000,Number(params.get("refresh"))||30000),duracao:Math.max(20,Number(params.get("duracao"))||72),rodapeMs:numeroPositivo("rodapeMin",1,.01)*60*1000,placarMs:numeroPositivo("placarMin",1,.01)*60*1000,forcarPlacar:params.get("preview")==="placar"||params.get("modo")==="placar",testeVisual:params.get("testeVisual")!=="0"};
      document.documentElement.style.setProperty("--duracao",`${CONFIG.duracao}s`);
      const CATEGORIAS=[{key:"masculino-1",nome:"1ª Divisão Masculina"},{key:"masculino-2",nome:"2ª Divisão Masculina"},{key:"feminino",nome:"1ª Divisão Feminina"}];
      const CLASSIFICACAO_ETAPA_2={
        "masculino-1":[{posicao:1,atleta:"Michel Belmonte",pontos:155},{posicao:2,atleta:"Antonio Toledo",pontos:140},{posicao:3,atleta:"Matheus Verão",pontos:140},{posicao:4,atleta:"Nilo Ponce",pontos:135},{posicao:5,atleta:"Gui Ponce",pontos:115}],
        "masculino-2":[{posicao:1,atleta:"Gustavo Buzelle",pontos:185},{posicao:2,atleta:"Célio Belmonte",pontos:155},{posicao:3,atleta:"Nelson Saga",pontos:150},{posicao:4,atleta:"Gilberto Ribeiro",pontos:125},{posicao:5,atleta:"Ronaldo Oliveira",pontos:120}],
        "feminino":[{posicao:1,atleta:"Raquel Tenuta",pontos:185},{posicao:2,atleta:"Joselia Moreno",pontos:165},{posicao:3,atleta:"Agda Nogueira",pontos:150},{posicao:4,atleta:"Danielle Ledur",pontos:145},{posicao:5,atleta:"Ednéia Miranda Saga",pontos:120}]
      };
      const escapeHtml=value=>String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;");
      const numero=value=>{const parsed=Number(String(value??0).replace(",",".").replace(/[^\d.-]/g,""));return Number.isFinite(parsed)?parsed:0};
      const formatarMedia=value=>numero(value).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
      const linhasDoDia=dia=>dia===2?[7,8,9,10,11]:[1,2,3,4,5,6];
      const normalizarJogos=(jogos,dia)=>{const mapa=new Map((Array.isArray(jogos)?jogos:[]).map((jogo,index)=>[numero(jogo?.linha)||linhasDoDia(dia)[index],numero(jogo?.pontos??jogo?.valor??jogo)]));return linhasDoDia(dia).map(linha=>({linha,pontos:mapa.get(linha)||null}))};
      const normalizarAtletas=(atletas,diaResposta)=>atletas.map((atleta,index)=>{const dia=numero(atleta.dia)||diaResposta||1;return{posicao:numero(atleta.posicao||atleta.pos||index+1),atleta:atleta.atleta||atleta.nome_evento||atleta.nome_completo||atleta.nome||"Atleta",dia,total:numero(atleta.total||atleta.pontos_serie||atleta.t),media:numero(atleta.media||atleta.m),jogos:normalizarJogos(atleta.jogos,dia)}});
      let resultadosAtuais=CATEGORIAS.map(categoria=>({categoria,atletas:[],live:false,dia:null}));
      let cycleStartedAt=Date.now();let modoAtual="rodape";let grupoAtual=-1;
      async function buscarCategoria(categoria){
        const controller=new AbortController();const timeout=window.setTimeout(()=>controller.abort(),25000);
        const consultar=async(evento,demo=false)=>{const endpoint=new URL(`${CONFIG.apiBase}/api/top`);endpoint.searchParams.set("evento",evento);endpoint.searchParams.set("categoria",categoria.key);endpoint.searchParams.set("dia",CONFIG.dia);endpoint.searchParams.set("limite","20");endpoint.searchParams.set("_",Date.now().toString());const resposta=await fetch(endpoint,{cache:"no-store",headers:{Accept:"application/json"},signal:controller.signal});if(!resposta.ok)throw new Error(`HTTP ${resposta.status}`);const dados=await resposta.json();if(dados?.status!=="ok"||!Array.isArray(dados.atletas)||!dados.atletas.length)throw new Error("Sem resultados oficiais");const dia=numero(dados.dia)||1;return{categoria,atletas:normalizarAtletas(dados.atletas,dia),live:true,dia,demo}};
        try{return await consultar(CONFIG.evento)}catch(erro){if(CONFIG.testeVisual&&CONFIG.evento==="590"){try{return await consultar("589",true)}catch(erroDemo){}}return{categoria,atletas:[],live:false,dia:null,demo:false}}finally{window.clearTimeout(timeout)}
      }
      function renderizarCategoriaTicker(resultado){
        const fallback=CLASSIFICACAO_ETAPA_2[resultado.categoria.key];const usarAoVivo=resultado.live&&!resultado.demo;const atletas=(usarAoVivo?resultado.atletas:fallback).slice(0,5);const origem=usarAoVivo?`Evento ${CONFIG.evento} • Dia ${resultado.dia}`:"Circuito após 2 etapas";
        const itens=atletas.map((atleta,index)=>{const complemento=usarAoVivo?`${atleta.total} pontos • média ${formatarMedia(atleta.media)}`:`${atleta.pontos} pts no Circuito`;return `<span class="ranking"><span class="position">${escapeHtml(atleta.posicao||index+1)}º</span><span class="athlete">${escapeHtml(atleta.atleta)}</span><span class="details">${escapeHtml(complemento)}</span></span><span class="separator"></span>`}).join("");
        return `<span class="category">${escapeHtml(resultado.categoria.nome)} • ${escapeHtml(origem)}</span><span class="separator"></span>${itens}`
      }
      function renderizarTicker(){
        const evento=`<span class="credits">Etapa 3 • Campo Novo dos Parecis • 10 e 11 de outubro</span><span class="separator"></span>`;const apoio=`<span class="credits">Realização BolicheMT - Apoio SECEL-MT - Transmissão TBF300 Sports</span><span class="separator"></span>`;const conteudo=resultadosAtuais.map(renderizarCategoriaTicker).join("")+evento+apoio;
        document.getElementById("groupA").innerHTML=conteudo;document.getElementById("groupB").innerHTML=conteudo;const track=document.querySelector(".track");if(!track.classList.contains("running"))window.requestAnimationFrame(()=>window.requestAnimationFrame(()=>track.classList.add("running")))
      }
      function diaAtualDoEvento(){return Math.max(1,...resultadosAtuais.filter(resultado=>resultado.live).map(resultado=>resultado.dia||1))}
      function valorJogo(atleta,linha,diaExibicao){if(!atleta||atleta.dia!==diaExibicao)return "—";const jogo=atleta.jogos.find(item=>item.linha===linha);return jogo?.pontos||"—"}
      function linhasTabela(resultado,diaExibicao,numeroGrupo){
        const linhas=linhasDoDia(diaExibicao);const inicio=numeroGrupo*3;const atletas=resultado.atletas.slice(inicio,inicio+3);
        return Array.from({length:3},(_,indice)=>{const atleta=atletas[indice];const posicao=atleta?.posicao||inicio+indice+1;if(!atleta)return `<tr class="empty-row"><td><span class="pos-badge">${posicao}</span></td><td class="name">—</td>${linhas.map(()=>"<td>—</td>").join("")}<td class="total">—</td><td class="average">—</td></tr>`;return `<tr><td><span class="pos-badge">${escapeHtml(posicao)}</span></td><td class="name">${escapeHtml(atleta.atleta)}</td>${linhas.map(linha=>`<td class="game">${escapeHtml(valorJogo(atleta,linha,diaExibicao))}</td>`).join("")}<td class="total">${escapeHtml(atleta.total)}</td><td class="average">${escapeHtml(formatarMedia(atleta.media))}</td></tr>`}).join("")
      }
      function renderizarQuadros(){
        const diaExibicao=diaAtualDoEvento();const linhas=linhasDoDia(diaExibicao);
        const totalGrupos=Math.max(1,...resultadosAtuais.map(resultado=>Math.ceil(resultado.atletas.length/3)));const numeroGrupo=((grupoAtual<0?0:grupoAtual)%totalGrupos);const inicio=numeroGrupo*3+1;const fim=inicio+2;
        document.getElementById("cards").innerHTML=resultadosAtuais.map(resultado=>{const situacao=resultado.demo?"Teste visual • API evento 589":resultado.live?`Atualização automática • Dia ${diaExibicao}`:"Aguardando categoria";const classe=resultado.live?"live-dot":"live-dot waiting";return `<article class="result-card"><header class="card-head"><h2 class="card-title">${escapeHtml(resultado.categoria.nome)}</h2><div class="card-subtitle"><span>${inicio}º ao ${fim}º • Dia ${diaExibicao} • T/M acumulados</span><span class="${classe}">${escapeHtml(situacao)}</span></div></header><table class="results-table"><thead><tr><th class="pos">#</th><th class="name">Atleta</th>${linhas.map(linha=>`<th class="game">L${linha}</th>`).join("")}<th class="total" title="Total acumulado">T</th><th class="average" title="Média acumulada">M</th></tr></thead><tbody>${linhasTabela(resultado,diaExibicao,numeroGrupo)}</tbody></table></article>`}).join("")
      }
      function definirModo(modo){if(modoAtual===modo)return;modoAtual=modo;document.body.classList.toggle("modo-placar",modo==="placar");document.body.classList.toggle("modo-rodape",modo!=="placar")}
      function temResultadosParaExibir(){return resultadosAtuais.some(resultado=>resultado.live&&resultado.atletas.length>0)}
      function aplicarGrupo(novoGrupo){if(novoGrupo===grupoAtual)return;grupoAtual=novoGrupo;renderizarQuadros()}
      function aplicarCiclo(){
        const temResultados=temResultadosParaExibir();
        if(CONFIG.forcarPlacar){if(!temResultados){definirModo("rodape");return}definirModo("placar");aplicarGrupo(Math.floor((Date.now()-cycleStartedAt)/30000));return}
        const total=CONFIG.rodapeMs+CONFIG.placarMs;const decorrido=(Date.now()-cycleStartedAt)%total;const exibir=decorrido>=CONFIG.rodapeMs&&temResultados;
        definirModo(exibir?"placar":"rodape");if(exibir)aplicarGrupo(Math.floor((decorrido-CONFIG.rodapeMs)/30000));else grupoAtual=-1
      }
      async function atualizar(){const novos=await Promise.all(CATEGORIAS.map(buscarCategoria));resultadosAtuais=novos.map((novo,indice)=>{const anterior=resultadosAtuais[indice];return anterior?.live&&(!novo.live||(anterior.dia||0)>(novo.dia||0))?anterior:novo});renderizarTicker();renderizarQuadros();aplicarCiclo()}
      async function verificarVersao(){try{const resposta=await fetch(`${window.location.pathname}?_versao=${Date.now()}`,{cache:"no-store"});const html=await resposta.text();const versao=html.match(/const BUILD_ID="([^"]+)"/);if(versao&&versao[1]!==BUILD_ID){const destino=new URL(window.location.href);destino.searchParams.set("_build",versao[1]);window.location.replace(destino.toString())}}catch(erro){}}
      if(params.get("_build")!==BUILD_ID){const destino=new URL(window.location.href);destino.searchParams.set("_build",BUILD_ID);window.location.replace(destino.toString());return}
      cycleStartedAt=Date.now();renderizarTicker();renderizarQuadros();aplicarCiclo();atualizar();window.setInterval(atualizar,CONFIG.refreshMs);window.setInterval(aplicarCiclo,500);window.setInterval(verificarVersao,60000)
    })();
  </script>
</body>
</html>
